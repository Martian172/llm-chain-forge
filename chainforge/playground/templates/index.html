<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Chain Forge — Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <style>
    :root {
      --bg: #0d0d1a; --surface: #12121f; --surface2: #1a1a2e;
      --border: #252540; --accent: #7c3aed; --accent2: #a855f7;
      --neon: #c026d3; --cyan: #06b6d4; --green: #10b981;
      --text: #e2e8f0; --muted: #64748b; --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Navbar */
    nav { display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; height:56px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
    .logo { display:flex; align-items:center; gap:0.6rem; font-weight:700; font-size:1rem; }
    .logo span { background: linear-gradient(135deg, var(--accent2), var(--cyan)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .nav-controls { display:flex; align-items:center; gap:0.75rem; }
    select { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:0.35rem 0.75rem; border-radius:8px; font-size:0.8rem; outline:none; cursor:pointer; }
    .run-btn { background:linear-gradient(135deg, var(--accent), var(--neon)); border:none; color:#fff; font-weight:700; padding:0.45rem 1.2rem; border-radius:9px; cursor:pointer; font-size:0.85rem; transition:opacity 0.2s, transform 0.1s; display:flex; align-items:center; gap:0.4rem; }
    .run-btn:hover { opacity:0.9; transform:scale(1.03); }
    .run-btn:active { transform:scale(0.97); }

    /* Layout */
    .workspace { display:grid; grid-template-columns:260px 1fr 300px; flex:1; overflow:hidden; }

    /* Sidebar — Chain Builder */
    .sidebar { background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .sidebar-header { padding:1rem; font-size:0.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid var(--border); }
    .chain-steps { flex:1; overflow-y:auto; padding:0.75rem; display:flex; flex-direction:column; gap:0.5rem; }
    .step-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:0.75rem; cursor:grab; transition:border-color 0.2s, transform 0.15s; position:relative; }
    .step-card:hover { border-color:var(--accent2); transform:translateX(3px); }
    .step-card.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .step-name { font-size:0.82rem; font-weight:600; margin-bottom:0.25rem; }
    .step-provider { font-size:0.72rem; color:var(--muted); font-family:'JetBrains Mono', monospace; }
    .step-arrow { color:var(--muted); text-align:center; font-size:0.75rem; margin:0.1rem 0; }
    .add-step-btn { margin:0.75rem; background:transparent; border:1px dashed var(--border); border-radius:10px; padding:0.6rem; color:var(--muted); cursor:pointer; font-size:0.8rem; transition:border-color 0.2s, color 0.2s; }
    .add-step-btn:hover { border-color:var(--accent2); color:var(--accent2); }

    /* Center — Editor */
    .editor-panel { display:flex; flex-direction:column; overflow:hidden; }
    .editor-tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--border); }
    .tab { padding:0.6rem 1.2rem; font-size:0.8rem; font-weight:500; cursor:pointer; border-bottom:2px solid transparent; color:var(--muted); transition:color 0.2s; }
    .tab.active { border-color:var(--accent2); color:var(--accent2); }
    .editor-container { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .CodeMirror { height:100%; font-family:'JetBrains Mono', monospace; font-size:13px; background:var(--bg) !important; color:#c9d1d9; }
    .CodeMirror-gutters { background:var(--bg) !important; border-right:1px solid var(--border) !important; }
    .CodeMirror-linenumber { color:var(--muted) !important; }

    /* Right panel — Output */
    .output-panel { background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .output-header { padding:0.75rem 1rem; font-size:0.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .output-content { flex:1; overflow-y:auto; padding:1rem; font-family:'JetBrains Mono', monospace; font-size:0.78rem; line-height:1.6; }
    .output-content.loading { display:flex; align-items:center; justify-content:center; color:var(--muted); }
    .spinner { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--accent2); border-radius:50%; animation:spin 0.8s linear infinite; margin-right:0.75rem; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; padding:0.75rem 1rem; border-top:1px solid var(--border); }
    .stat { background:var(--surface2); border-radius:8px; padding:0.5rem 0.75rem; }
    .stat-label { font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
    .stat-value { font-size:0.9rem; font-weight:700; font-family:'JetBrains Mono', monospace; color:var(--cyan); margin-top:0.1rem; }

    .token-badge { display:inline-block; padding:2px 6px; border-radius:4px; font-size:0.65rem; font-weight:600; background:rgba(168,85,247,0.15); color:var(--accent2); }

    /* Glowing effect */
    .run-btn { box-shadow: 0 0 20px rgba(124,58,237,0.3); }
    .run-btn:hover { box-shadow: 0 0 30px rgba(124,58,237,0.5); }

    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

    @media (max-width: 900px) {
      /* Stack panels vertically instead of hiding them so the output
         (result, tokens, cost, latency) is always visible on narrow windows. */
      .workspace { grid-template-columns: 1fr; grid-auto-rows: minmax(0, auto); overflow-y: auto; }
      .sidebar { display: none; }
      .output-panel { border-left: none; border-top: 2px solid var(--accent2); min-height: 240px; }
      .editor-container { min-height: 260px; }
    }
  </style>
</head>
<body>
<nav>
  <div class="logo">⚒️ <span>LLM Chain Forge</span> <small style="color:var(--muted);font-size:0.7rem;font-weight:400">Playground</small></div>
  <div class="nav-controls">
    <select id="provider-select">
      <option value="mock">🔮 Mock Provider</option>
      <option value="openai">🤖 OpenAI</option>
      <option value="anthropic">🧠 Anthropic</option>
    </select>
    <select id="model-select">
      <option value="mock-model">mock-model</option>
      <option value="gpt-4o-mini">gpt-4o-mini</option>
      <option value="gpt-4o">gpt-4o</option>
      <option value="claude-3-haiku">claude-3-haiku</option>
    </select>
    <button class="run-btn" onclick="runChain()">▶ Run Chain</button>
  </div>
</nav>

<div class="workspace">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">Chain Builder</div>
    <div class="chain-steps" id="chain-steps">
      <div class="step-card active" onclick="selectStep(this)">
        <div class="step-name">📥 Input</div>
        <div class="step-provider">passthrough</div>
      </div>
      <div class="step-arrow">↓</div>
      <div class="step-card" onclick="selectStep(this)">
        <div class="step-name">✏️ Rewrite</div>
        <div class="step-provider">mock-model · T=0.7</div>
      </div>
      <div class="step-arrow">↓</div>
      <div class="step-card" onclick="selectStep(this)">
        <div class="step-name">📊 Summarize</div>
        <div class="step-provider">mock-model · T=0.3</div>
      </div>
      <div class="step-arrow">↓</div>
      <div class="step-card" onclick="selectStep(this)">
        <div class="step-name">📤 Output</div>
        <div class="step-provider">passthrough</div>
      </div>
    </div>
    <button class="add-step-btn" onclick="addStep()">＋ Add Step</button>
  </div>

  <!-- Editor -->
  <div class="editor-panel">
    <div class="editor-tabs">
      <div class="tab active" onclick="switchTab(this, 'prompt')">Prompt Template</div>
      <div class="tab" onclick="switchTab(this, 'input')">Input Variables</div>
      <div class="tab" onclick="switchTab(this, 'config')">Chain Config</div>
    </div>
    <div class="editor-container">
      <textarea id="prompt-editor">You are a helpful AI assistant.

Summarize the following text in a clear and concise way:

{{input}}

Provide:
1. A one-sentence TL;DR
2. Three key points
3. Any important caveats

Summary:</textarea>
    </div>
  </div>

  <!-- Output -->
  <div class="output-panel">
    <div class="output-header">
      Output <span class="token-badge" id="token-badge">0 tokens</span>
    </div>
    <div class="output-content" id="output-content" style="color:var(--muted)">
      Press <strong style="color:var(--accent2)">▶ Run Chain</strong> to execute...
    </div>
    <div class="stats-grid">
      <div class="stat"><div class="stat-label">Latency</div><div class="stat-value" id="stat-latency">—</div></div>
      <div class="stat"><div class="stat-label">Cost</div><div class="stat-value" id="stat-cost">—</div></div>
      <div class="stat"><div class="stat-label">Prompt Tokens</div><div class="stat-value" id="stat-prompt">—</div></div>
      <div class="stat"><div class="stat-label">Completion</div><div class="stat-value" id="stat-completion">—</div></div>
    </div>
  </div>
</div>

<script>
  // CodeMirror editor
  const cm = CodeMirror.fromTextArea(document.getElementById('prompt-editor'), {
    mode: 'javascript', theme: 'default', lineNumbers: true, lineWrapping: true,
  });
  cm.setSize('100%', '100%');

  function selectStep(el) {
    document.querySelectorAll('.step-card').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
  }

  let stepCount = 4;
  function addStep() {
    const steps = document.getElementById('chain-steps');
    const arrow = document.createElement('div');
    arrow.className = 'step-arrow'; arrow.textContent = '↓';
    const card = document.createElement('div');
    card.className = 'step-card';
    card.onclick = () => selectStep(card);
    card.innerHTML = `<div class="step-name">🔗 Step ${++stepCount}</div><div class="step-provider">mock-model · T=0.7</div>`;
    steps.appendChild(arrow);
    steps.appendChild(card);
    selectStep(card);
  }

  function switchTab(el, tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  async function runChain() {
    const out = document.getElementById('output-content');
    out.innerHTML = '<div class="loading"><div class="spinner"></div>Running chain...</div>';
    out.style.color = '';

    const prompt = cm.getValue();
    const provider = document.getElementById('provider-select').value;
    const model = document.getElementById('model-select').value;

    const payload = {
      chain_config: {
        links: [
          { name: "step1", prompt: prompt },
        ]
      },
      input: { input: "The quick brown fox jumps over the lazy dog. This is a test of the LLM Chain Forge playground." },
      provider, model,
    };

    try {
      const start = Date.now();
      const resp = await fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      const elapsed = Date.now() - start;

      if (data.error) {
        out.style.color = '#ef4444';
        out.textContent = '❌ Error: ' + data.error;
      } else {
        out.style.color = '';
        out.innerHTML = `<div style="white-space:pre-wrap;color:var(--text)">${escapeHtml(data.output || '')}</div>`;
        document.getElementById('stat-latency').textContent = `${elapsed}ms`;
        document.getElementById('stat-cost').textContent = data.cost_usd != null ? `$${(data.cost_usd||0).toFixed(5)}` : '—';
        const tu = data.token_usage || {};
        document.getElementById('stat-prompt').textContent = tu.prompt_tokens ?? tu.prompt ?? '—';
        document.getElementById('stat-completion').textContent = tu.completion_tokens ?? tu.completion ?? '—';
        const total = (tu.prompt_tokens ?? 0) + (tu.completion_tokens ?? 0);
        document.getElementById('token-badge').textContent = `${total} tokens`;
      }
    } catch(e) {
      out.style.color = '#ef4444';
      out.textContent = '❌ Connection error: ' + e.message;
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // WebSocket
  try {
    const ws = new WebSocket(`ws://${location.host}/ws/run`);
    ws.onopen = () => console.log('WS connected');
  } catch(_) {}
</script>
</body>
</html>
